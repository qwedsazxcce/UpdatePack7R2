name: Windows7&Server2008R2_Combined_ESD
on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/ultentserver2008r2.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      WIN7_001: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/Windows7_Ult%26Ent_32&64/Windows7_Ult.Ent_32.64.esd.7z.001
      WIN7_002: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/Windows7_Ult%26Ent_32&64/Windows7_Ult.Ent_32.64.esd.7z.002
      SVR_001: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.001
      SVR_002: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.002
      SVR_003: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.003
      SVR_004: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.004
      WORK_DIR: ${{ github.workspace }}
      MAIN_ESD: Windows7_Ult&Ent_32&64.esd
      TEMP_WIM: temp_svr.wim
      RELEASE_NAME: Windows7_Server2008R2_Combined

    steps:
      - uses: actions/checkout@v4

      # 1. 清理旧版本
      - name: Clean old release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release delete $env:RELEASE_NAME -y 2>&1 | Out-Null
          git tag -d $env:RELEASE_NAME 2>&1 | Out-Null
          git push origin --delete refs/tags/$env:RELEASE_NAME 2>&1 | Out-Null

      # 2. 处理Win7：下载→解压→删包
      - name: Process Windows7
        shell: pwsh
        run: |
          curl.exe -L -o win7.7z.001 $env:WIN7_001
          curl.exe -L -o win7.7z.002 $env:WIN7_002
          7z x -y win7.7z.001 -o$env:WORK_DIR
          del win7.7z.*

      # 3. 处理Server：下载→解压→删包→【打印全目录！！！】
      - name: Process Server2008R2
        shell: pwsh
        run: |
          curl.exe -L -o svr.7z.001 $env:SVR_001
          curl.exe -L -o svr.7z.002 $env:SVR_002
          curl.exe -L -o svr.7z.003 $env:SVR_003
          curl.exe -L -o svr.7z.004 $env:SVR_004
          7z x -y svr.7z.001 -o$env:WORK_DIR
          del svr.7z.*
          # 【关键！打印所有文件+子文件夹，绝不瞎猜】
          Write-Host "=== 所有文件（递归）==="
          Get-ChildItem $env:WORK_DIR -Recurse | Select-Object FullName | Format-List

      # 4. 【终极搜索：递归找所有镜像，不管在哪！】
      - name: Find and Extract Server Image
        shell: pwsh
        run: |
          # 递归搜索 所有 .wim / .esd，排除Win7主文件，找到第一个
          $image = Get-ChildItem -Path $env:WORK_DIR -Recurse -Include @("*.wim","*.esd") | Where-Object { $_.Name -ne $env:MAIN_ESD } | Select-Object -First 1
          
          if (-not $image) {
            Write-Error "搜索失败，以上是所有文件，请检查！"
            exit 1
          }
          
          Write-Host "✅ 找到镜像: $($image.FullName)"
          # 提取索引5
          dism /export-image /sourceimagefile:"$($image.FullName)" /sourceindex:5 /destinationimagefile:"$env:WORK_DIR\$env:TEMP_WIM" /compress:max /checkintegrity

      # 5. 追加到主ESD
      - name: Append to Main ESD
        shell: pwsh
        run: |
          dism /export-image /sourceimagefile:"$env:WORK_DIR\$env:TEMP_WIM" /sourceindex:1 /destinationimagefile:"$env:WORK_DIR\$env:MAIN_ESD" /checkintegrity

      # 6. 清理临时文件
      - name: Clean Temp
        shell: pwsh
        run: |
          Get-ChildItem -Path $env:WORK_DIR -Recurse -Include @("*.wim","*.esd") | Where-Object { $_.Name -ne $env:MAIN_ESD } | Remove-Item -Force

      # 7. 分卷压缩（绝对正确，硬编码）
      - name: Split Compress
        shell: pwsh
        run: |
          7z a -y -v1950M "$env:MAIN_ESD.7z" "$env:MAIN_ESD"
          del $env:MAIN_ESD

      # 8. 上传
      - name: Upload
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "$env:MAIN_ESD.7z.*"
          gh release create $env:RELEASE_NAME $files.FullName --title $env:RELEASE_NAME --notes "Win7+Server2008R2" --latest
