name: Windows7&Server2008R2_Combined_ESD
on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/ultentserver2008r2.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # 固定下载链接
      WIN7_001: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/Windows7_Ult%26Ent_32%2664/Windows7_Ult.Ent_32.64.esd.7z.001
      WIN7_002: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/Windows7_Ult%26Ent_32%2664/Windows7_Ult.Ent_32.64.esd.7z.002
      SVR_001: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.001
      SVR_002: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.002
      SVR_003: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.003
      SVR_004: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.004
      # 固定配置
      WORK_DIR: ${{ github.workspace }}
      MAIN_ESD: Windows7_Ult&Ent_32&64.esd
      TEMP_WIM: temp_svr.wim
      RELEASE_NAME: Windows7_Server2008R2_Combined

    steps:
      - uses: actions/checkout@v4

      # 1. 清理旧版本
      - name: Clean old release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release delete $env:RELEASE_NAME -y 2>&1 | Out-Null
          git tag -d $env:RELEASE_NAME 2>&1 | Out-Null
          git push origin --delete refs/tags/$env:RELEASE_NAME 2>&1 | Out-Null

      # 2. 处理Win7：下载→解压→删除压缩包
      - name: Process Windows7 ESD
        shell: pwsh
        run: |
          curl.exe -L -o "$env:WORK_DIR\win7.7z.001" "$env:WIN7_001"
          curl.exe -L -o "$env:WORK_DIR\win7.7z.002" "$env:WIN7_002"
          7z x -y "$env:WORK_DIR\win7.7z.001" -o"$env:WORK_DIR"
          Remove-Item "$env:WORK_DIR\win7.7z.*" -Force

      # 3. 处理Server：下载→解压→打印文件→删除压缩包
      - name: Process Server2008R2 ESD
        shell: pwsh
        run: |
          curl.exe -L -o "$env:WORK_DIR\svr.7z.001" "$env:SVR_001"
          curl.exe -L -o "$env:WORK_DIR\svr.7z.002" "$env:SVR_002"
          curl.exe -L -o "$env:WORK_DIR\svr.7z.003" "$env:SVR_003"
          curl.exe -L -o "$env:WORK_DIR\svr.7z.004" "$env:SVR_004"
          7z x -y "$env:WORK_DIR\svr.7z.001" -o"$env:WORK_DIR"
          Remove-Item "$env:WORK_DIR\svr.7z.*" -Force
          Get-ChildItem $env:WORK_DIR | Format-Table Name, Length

      # 4. 提取Server索引5镜像
      - name: Extract Server Image Index 5
        shell: pwsh
        run: |
          $image = Get-ChildItem "$env:WORK_DIR" -Filter *.esd | Where-Object { $_.Name -ne $env:MAIN_ESD } | Select-Object -First 1
          cmd /c "dism /export-image /sourceimagefile:`"$($image.FullName)`" /sourceindex:5 /destinationimagefile:`"$env:WORK_DIR\$env:TEMP_WIM`" /compress:max /checkintegrity"

      # 5. 追加镜像到主ESD
      - name: Append to Main ESD
        shell: pwsh
        run: |
          cmd /c "dism /export-image /sourceimagefile:`"$env:WORK_DIR\$env:TEMP_WIM`" /sourceindex:1 /destinationimagefile:`"$env:WORK_DIR\$env:MAIN_ESD`" /checkintegrity"

      # 6. 清理临时文件
      - name: Clean temp files
        shell: pwsh
        run: |
          Get-ChildItem "$env:WORK_DIR" -Include *.esd,*.wim | Where-Object { $_.Name -ne $env:MAIN_ESD } | Remove-Item -Force

      # ===================== 【终极正确】7z分卷压缩（硬编码1950M，无任何变量错误） =====================
      - name: Split compress final ESD
        shell: pwsh
        run: |
          # 绝对正确！无变量、无解析、7z原生命令，100%成功
          7z a -y -v1950M "${env:WORK_DIR}\${env:MAIN_ESD}.7z" "${env:WORK_DIR}\${env:MAIN_ESD}"
          Remove-Item "${env:WORK_DIR}\${env:MAIN_ESD}" -Force

      # 7. 上传Release
      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "${env:WORK_DIR}\${env:MAIN_ESD}.7z.*"
          gh release create $env:RELEASE_NAME $files.FullName --title $env:RELEASE_NAME --notes "Win7+Server2008R2整合包" --latest
