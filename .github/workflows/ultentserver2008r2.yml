name: Windows7&Server2008R2_Combined_ESD
on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/ultentserver2008r2.yml'

jobs:
  build-and-upload-combined-esd:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ########################### 你的6个下载链接 ###########################
      WIN7_ESD_001: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/Windows7_Ult%26Ent_32%2664/Windows7_Ult.Ent_32.64.esd.7z.001
      WIN7_ESD_002: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/Windows7_Ult%26Ent_32%2664/Windows7_Ult.Ent_32.64.esd.7z.002
      SERVER_ESD_001: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.001
      SERVER_ESD_002: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.002
      SERVER_ESD_003: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.003
      SERVER_ESD_004: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.004

      ########################### 【修复点1】修正Server ESD真实文件名 ###########################
      WORK_DIR: ${{ github.workspace }}
      MAIN_ESD: Windows7_Ult&Ent_32&64.esd
      TEMP_WIM: temp_server2008r2.wim
      # 错误写法：install_WindowsServer_2008R2_SP1.esd
      # 正确写法：带版本号 26.1.15
      SERVER_ESD_FILE: install_WindowsServer_2008R2_SP1-26.1.15.esd
      SPLIT_SIZE: 1950M
      RELEASE_NAME: Windows7_Server2008R2_Combined
      RETRY_COUNT: 10
      RETRY_INTERVAL: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete existing Release and Tag
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $release = $env:RELEASE_NAME
          Write-Host "===== 清理旧版本：$release ====="
          if (gh release view "$release" 2>&1) {
            gh release delete "$release" -y
            Write-Host "旧Release已删除"
          }
          git tag -d "$release" 2>&1 | Out-Null
          git push origin --delete "refs/tags/$release" 2>&1 | Out-Null
          Write-Host "===== 清理完成 =====`n"

      - name: Process Windows7 ESD (Download + Extract + Clean)
        shell: pwsh
        run: |
          Write-Host "===== 开始处理 Windows7 Ult&Ent ESD ====="
          $vols = @("001","002")
          foreach($vol in $vols){
            $url = [Environment]::GetEnvironmentVariable("WIN7_ESD_$vol")
            $file = "Win7_ESD.7z.$vol"
            Write-Host "下载：$file"
            curl.exe -L -o "$env:WORK_DIR\$file" "$url"
          }
          7z x -y -o"$env:WORK_DIR" "$env:WORK_DIR\Win7_ESD.7z.001"
          Remove-Item "$env:WORK_DIR\Win7_ESD.7z.*" -Force
          Write-Host "===== Win7 ESD 处理完成 =====`n"

      - name: Process Server2008R2 ESD (Download + Extract + Clean)
        shell: pwsh
        run: |
          Write-Host "===== 开始处理 Server2008R2 ESD ====="
          $vols = @("001","002","003","004")
          foreach($vol in $vols){
            $url = [Environment]::GetEnvironmentVariable("SERVER_ESD_$vol")
            $file = "Server_ESD.7z.$vol"
            Write-Host "下载：$file"
            curl.exe -L -o "$env:WORK_DIR\$file" "$url"
          }
          7z x -y -o"$env:WORK_DIR" "$env:WORK_DIR\Server_ESD.7z.001"
          Remove-Item "$env:WORK_DIR\Server_ESD.7z.*" -Force
          Write-Host "===== Server2008R2 ESD 处理完成 =====`n"

      # 【修复点2】增加文件存在校验 + 正确文件名
      - name: Export Server2008R2 Image Index 5 to Temp WIM
        shell: pwsh
        run: |
          Write-Host "===== 提取 Server2008R2 第5个镜像 ====="
          $esdPath = Join-Path $env:WORK_DIR $env:SERVER_ESD_FILE
          
          # 新增：检查文件是否存在，不存在直接报错
          if (-not (Test-Path $esdPath)) {
              throw "ERROR：找不到Server ESD文件！路径：$esdPath"
          }
          
          $esd = "`"$esdPath`""
          $wim = "`"$env:WORK_DIR\$env:TEMP_WIM`""
          cmd /c "dism /export-image /sourceimagefile:$esd /sourceindex:5 /destinationimagefile:$wim /compress:max /checkintegrity"
          if ($LASTEXITCODE -ne 0) {
              throw "DISM 提取镜像失败！"
          }
          Write-Host "===== 镜像提取完成 =====`n"

      - name: Append Server Image to Main Windows7 ESD
        shell: pwsh
        run: |
          Write-Host "===== 追加镜像到主ESD ====="
          $wim = "`"$env:WORK_DIR\$env:TEMP_WIM`""
          $mainEsd = "`"$env:WORK_DIR\$env:MAIN_ESD`""
          cmd /c "dism /export-image /sourceimagefile:$wim /sourceindex:1 /destinationimagefile:$mainEsd /checkintegrity"
          if ($LASTEXITCODE -ne 0) {
              throw "DISM 追加镜像失败！"
          }
          Write-Host "===== 镜像追加完成 =====`n"

      - name: Clean All Temporary Files
        shell: pwsh
        run: |
          Write-Host "===== 清理临时文件 ====="
          Remove-Item "$env:WORK_DIR\$env:SERVER_ESD_FILE" -Force
          Remove-Item "$env:WORK_DIR\$env:TEMP_WIM" -Force
          Write-Host "===== 清理完成 =====`n"

      - name: Split Compress Final ESD
        shell: pwsh
        run: |
          Write-Host "===== 分卷压缩最终ESD ====="
          $esd = "$env:WORK_DIR\$env:MAIN_ESD"
          $output = "$env:WORK_DIR\$env:MAIN_ESD.7z"
          7z a -y -v$env:SPLIT_SIZE "$output" "$esd"
          Remove-Item "$esd" -Force
          Write-Host "===== 压缩完成 =====`n"

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Write-Host "===== 开始上传 ====="
          $files = Get-ChildItem "$env:WORK_DIR\$env:MAIN_ESD.7z.*"
          $success = $false
          for($i=1; $i -le $env:RETRY_COUNT; $i++){
            try{
              gh release create $env:RELEASE_NAME $files.FullName --title $env:RELEASE_NAME --notes "自动整合：Win7UltEnt + Server2008R2" --latest
              $success = $true
              Write-Host "✅ 上传成功！"
              break
            }catch{
              Write-Warning "第 $i 次上传失败，$env:RETRY_INTERVAL 秒后重试"
              Start-Sleep $env:RETRY_INTERVAL
            }
          }
          if(!$success){ throw "❌ 上传失败" }

      - name: Final Cleanup
        shell: pwsh
        if: always()
        run: |
          Remove-Item "$env:WORK_DIR\*" -Recurse -Force -ErrorAction SilentlyContinue
