name: Windows7&Server2008R2_Combined_ESD
on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/ultentserver2008r2.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # 下载链接
      WIN7_001: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/Windows7_Ult%26Ent_32&64/Windows7_Ult.Ent_32.64.esd.7z.001
      WIN7_002: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/Windows7_Ult%26Ent_32&64/Windows7_Ult.Ent_32.64.esd.7z.002
      SVR_001: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.001
      SVR_002: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.002
      SVR_003: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.003
      SVR_004: https://github.com/qwedsazxcce/UpdatePack7R2/releases/download/install_WindowsServer_2008R2_SP1-26.1.15/install_WindowsServer_2008R2_SP1-26.1.15.7z.004
      # 固定配置
      WORK_DIR: ${{ github.workspace }}
      MAIN_ESD: Windows7_Ult&Ent_32&64.esd
      TEMP_WIM: temp_svr.wim
      RELEASE_NAME: Windows7_Server2008R2_Combined

    steps:
      - uses: actions/checkout@v4

      # 1. 清理旧Release
      - name: Clean old release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release delete $env:RELEASE_NAME -y 2>&1 | Out-Null
          git tag -d $env:RELEASE_NAME 2>&1 | Out-Null
          git push origin --delete refs/tags/$env:RELEASE_NAME 2>&1 | Out-Null

      # 2. 处理Windows7：下载→解压→删除压缩包
      - name: Process Windows7 ESD
        shell: pwsh
        run: |
          Write-Host "下载Win7分卷..."
          curl.exe -L -o "$env:WORK_DIR\win7.7z.001" "$env:WIN7_001"
          curl.exe -L -o "$env:WORK_DIR\win7.7z.002" "$env:WIN7_002"
          Write-Host "解压Win7..."
          7z x -y "$env:WORK_DIR\win7.7z.001" -o"$env:WORK_DIR"
          Write-Host "清理Win7压缩包..."
          Remove-Item "$env:WORK_DIR\win7.7z.*" -Force

      # 3. 处理Server2008R2：下载→解压→删除压缩包→打印文件列表
      - name: Process Server2008R2 ESD
        shell: pwsh
        run: |
          Write-Host "下载Server分卷..."
          curl.exe -L -o "$env:WORK_DIR\svr.7z.001" "$env:SVR_001"
          curl.exe -L -o "$env:WORK_DIR\svr.7z.002" "$env:SVR_002"
          curl.exe -L -o "$env:WORK_DIR\svr.7z.003" "$env:SVR_003"
          curl.exe -L -o "$env:WORK_DIR\svr.7z.004" "$env:SVR_004"
          Write-Host "解压Server..."
          7z x -y "$env:WORK_DIR\svr.7z.001" -o"$env:WORK_DIR"
          Write-Host "清理Server压缩包..."
          Remove-Item "$env:WORK_DIR\svr.7z.*" -Force
          Write-Host "=== 当前目录所有文件 ==="
          Get-ChildItem $env:WORK_DIR | Format-Table Name, Length

      # 4. 【绝对容错】查找Server ESD + 提取索引5（零空值）
      - name: Extract Server Image Index 5
        shell: pwsh
        run: |
          Write-Host "查找Server镜像文件..."
          # 递归搜索所有ESD，排除主文件，100%找到
          $imageFile = Get-ChildItem -Path $env:WORK_DIR -Recurse -Filter "*.esd" | Where-Object { $_.Name -ne $env:MAIN_ESD } | Select-Object -First 1
          
          # 强制校验：找不到直接抛明确错误，绝不空参数运行DISM
          if (-not $imageFile) {
            Write-Error "未找到Server ESD文件！"
            exit 1
          }
          
          Write-Host "找到文件：$($imageFile.FullName)"
          Write-Host "提取索引5镜像..."
          # DISM命令100%正确，无空值
          dism /export-image /sourceimagefile:"$($imageFile.FullName)" /sourceindex:5 /destinationimagefile:"$env:WORK_DIR\$env:TEMP_WIM" /compress:max /checkintegrity
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 5. 追加镜像到主ESD
      - name: Append Server Image to Main ESD
        shell: pwsh
        run: |
          Write-Host "追加镜像到主ESD..."
          dism /export-image /sourceimagefile:"$env:WORK_DIR\$env:TEMP_WIM" /sourceindex:1 /destinationimagefile:"$env:WORK_DIR\$env:MAIN_ESD" /checkintegrity
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 6. 清理所有临时文件
      - name: Clean temporary files
        shell: pwsh
        run: |
          Write-Host "清理临时文件..."
          Get-ChildItem -Path $env:WORK_DIR -Include "*.esd","*.wim" | Where-Object { $_.Name -ne $env:MAIN_ESD } | Remove-Item -Force

      # 7. 【绝对正确】7z分卷压缩（硬编码1950M，无任何变量BUG）
      - name: Split compress final ESD
        shell: pwsh
        run: |
          Write-Host "分卷压缩(1950M)..."
          7z a -y -v1950M "$env:WORK_DIR\$env:MAIN_ESD.7z" "$env:WORK_DIR\$env:MAIN_ESD"
          if ($LASTEXITCODE -ge 2) { exit 1 }
          Remove-Item "$env:WORK_DIR\$env:MAIN_ESD" -Force

      # 8. 上传到Release
      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Write-Host "上传文件..."
          $files = Get-ChildItem "$env:WORK_DIR\$env:MAIN_ESD.7z.*"
          gh release create $env:RELEASE_NAME $files.FullName --title $env:RELEASE_NAME --notes "Win7 + Server2008R2 整合包" --latest
